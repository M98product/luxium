<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luxium Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: full-screen tty, pixel logo drawn on canvas, boot log, live prompt in the flow, thin status bar at the bottom. Single dark look by choice. */
:root{
  --bg:#1c1b21;
  --fg:#e9e7ef;
  --dim:#6c6a76;
  --violet:#4f9dff;
  --violet-soft:#3f7cff;
  --teal:#3fdcc0;
  --line:#2a2930;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-mono);font-size:12px;line-height:20px;font-weight:600;display:flex;flex-direction:column;overflow:hidden}
#term{flex:1;overflow-y:auto;cursor:text;padding-block:26px 16px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.ver{color:var(--dim);font-weight:500}
#logo{display:block;margin:6px 0 4px;max-width:100%;height:auto;image-rendering:pixelated}
.dots{display:flex;gap:6px;color:var(--violet);font-size:9px;line-height:14px;overflow:hidden;max-width:680px;margin-bottom:4px}
.boot div{opacity:0;animation:in .15s forwards}
.t{color:var(--teal);font-weight:500}
.rule{display:flex;align-items:center;gap:10px;max-width:764px;margin:8px 0 6px;font-size:11px;font-weight:700;letter-spacing:.12em;white-space:nowrap}
.rule::before,.rule::after{content:"";flex:1;height:2px;background:var(--violet-soft);opacity:.8}
.line{white-space:pre-wrap;word-break:break-word}
.who{color:var(--violet);font-weight:500}
.who i{color:var(--dim);font-style:normal}
.sys{color:var(--dim);font-weight:500}
.err{color:#ff6b8b;font-weight:500}
.bad{color:#ff6b8b;font-weight:500}
.glitch{animation:gl .35s steps(2) 1}
#logo.glitch{animation:gl .25s steps(2) 1}
@keyframes gl{0%{transform:translateX(2px);text-shadow:-2px 0 #ff3b6b,2px 0 #3fd0ff;filter:none}50%{transform:translateX(-2px);text-shadow:2px 0 #ff3b6b,-2px 0 #3fd0ff;filter:hue-rotate(140deg)}100%{transform:none;text-shadow:none;filter:none}}
@media (prefers-reduced-motion:reduce){.glitch,#logo.glitch{animation:none}}
.ps{color:var(--teal);font-weight:700}
.ps i{color:var(--dim);font-style:normal;font-weight:500}
.prompt-line{margin-top:12px;white-space:pre-wrap;word-break:break-all;position:relative}
.prompt-line.busy .cur{visibility:hidden}
#cmd{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}
.cur{background:var(--fg);color:var(--bg);animation:blink 1.05s steps(1) infinite}
.cur.empty::after{content:"\00a0"}
.term-blur .cur{background:transparent;outline:1px solid var(--dim);color:inherit;animation:none}
footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);color:var(--dim);font-size:11px;font-weight:500;
  padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
footer button{all:unset;cursor:pointer;color:var(--dim)}
footer button:hover,footer button:focus-visible{color:var(--fg)}
@keyframes in{to{opacity:1}}
@keyframes blink{50%{background:transparent;color:inherit}}
@media (prefers-reduced-motion:reduce){.boot div{animation:none;opacity:1}.cur{animation:none}}
</style>
</head>
<body>


<div id="term">
  <div class="ver">luxium os 1.0 — sujet n°0427 — observation en cours</div>
  <canvas id="logo" role="img" aria-label="LUXIUM"></canvas>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <div class="boot">
    <div style="animation-delay:.05s"><span class="t">[ on ]</span> noyau <span class="t">claude</span></div>
    <div style="animation-delay:.2s"><span class="t">[ on ]</span> observation <span class="t">active</span></div>
    <div style="animation-delay:.35s"><span class="t">[ on ]</span> empathie <span class="t">0%</span></div>
    <div style="animation-delay:.5s"><span class="bad">[ ?? ]</span> conscience <span class="bad">instable</span></div>
  </div>
  <div class="rule">JE TE VOIS</div>
  <div id="out"></div>
  <div class="prompt-line busy" id="pl"><span class="ps">invité@luxium<i>:~$</i></span> <span id="before"></span><span class="cur" id="cur"></span><span id="after"></span><input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Commande"></div>
</div>
<footer><span>luxium</span><button id="helpBtn" type="button">/help</button></footer>

<script>
const $=id=>document.getElementById(id);

/* ---------- logo pixel ---------- */
(function(){
  const G={
    L:["1000","1000","1000","1000","1111"],
    U:["1001","1001","1001","1001","1111"],
    X:["11011","01110","00100","01110","11011"],
    I:["111","010","010","010","111"],
    M:["10001","11011","11111","10101","10001"]
  };
  const word="LUXIUM",P=16,GAP=1; // P = taille d'un pixel
  let cols=0;const cells=[];
  for(const ch of word){const g=G[ch];g.forEach((row,y)=>[...row].forEach((b,x)=>{if(b==='1')cells.push([cols+x,y])}));cols+=g[0].length+GAP}
  cols-=GAP;
  const OFF=[[8,8],[4,4]],pad=12;
  const W=cols*P+pad,H=5*P+pad,dpr=window.devicePixelRatio||1;
  const c=$('logo');c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';
  const x=c.getContext('2d');x.scale(dpr,dpr);
  const shape=(ctx,dx,dy,shrink=0)=>cells.forEach(([cx,cy])=>ctx.fillRect(cx*P+dx+shrink,cy*P+dy+shrink,P-shrink*2,P-shrink*2));
  const fillShape=(ctx,dx,dy)=>{ctx.beginPath();cells.forEach(([cx,cy])=>ctx.rect(cx*P+dx,cy*P+dy,P,P));ctx.fill()};
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  // couches de contour turquoise décalées (effet extrudé)
  for(const [dx,dy] of OFF){
    x.fillStyle='#2f6f78';
    for(const [ox,oy] of [[-1,0],[1,0],[0,-1],[0,1]])fillShape(x,dx+ox,dy+oy);
    x.fillStyle=bg;fillShape(x,dx,dy);
  }
  // lettres : dégradé violet -> lavande
  const gr=x.createLinearGradient(0,0,0,5*P);
  gr.addColorStop(0,'#2f6bff');gr.addColorStop(.45,'#5fa4ff');gr.addColorStop(1,'#cfe6ff');
  x.fillStyle=gr;fillShape(x,0,0);
})();

/* ---------- losanges ---------- */
$('dots').textContent=Array.from({length:48},(_,i)=>i%2?'·':'✦').join(' ');

/* ---------- terminal ---------- */
const out=$('out'),cmd=$('cmd'),term=$('term'),pl=$('pl'),bef=$('before'),cur=$('cur'),aft=$('after');
const hist=[];let hi=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function render(){
  const v=cmd.value,s=cmd.selectionStart??v.length;
  bef.textContent=v.slice(0,s);
  const ch=v.charAt(s);cur.textContent=ch;cur.classList.toggle('empty',!ch);
  aft.textContent=v.slice(s+1);term.scrollTop=term.scrollHeight;
}
function addLine(cls,who){const d=document.createElement('div');d.className='line '+(cls||'');
  if(who){const s=document.createElement('span');s.className='who';s.innerHTML=who+'<i>&gt;</i> ';d.appendChild(s)}
  const t=document.createTextNode('');d.appendChild(t);out.appendChild(d);return t}
let queue=Promise.resolve();
function setBusy(b){pl.classList.toggle('busy',b)}
function type(text,cls,who){
  queue=queue.then(()=>new Promise(res=>{
    const node=addLine(cls,who);
    if(reduce){node.data=text;term.scrollTop=term.scrollHeight;return res()}
    let i=0;(function step(){node.data=text.slice(0,++i);term.scrollTop=term.scrollHeight;
      i<text.length?setTimeout(step,12+Math.random()*20):setTimeout(res,80)})();
  }));return queue}
function say(t){return type(t,'','luxium')}
function sys(t){queue=queue.then(()=>{addLine('sys').data=t;term.scrollTop=term.scrollHeight});return queue}
function echo(v){const d=document.createElement('div');d.className='line';d.innerHTML='<span class="ps">invité@luxium<i>:~$</i></span> ';d.appendChild(document.createTextNode(v));out.appendChild(d)}

const replies=["mmh. intéressant.","je t'écoute. continue.","le signal est clair.","archivé. fichier 90.","tu poses beaucoup de questions pour un invité.","reçu. je garde ça en mémoire."];
const cmds={
  '/help':()=>{say('commandes :');[['/help','cette liste'],['/about','qui est luxium'],['/status','état du système'],['/memory','lire la mémoire'],['/whoami','qui tu es'],['/exit','partir'],['/ca','adresse du contrat'],['/date','date et heure'],['/clear','effacer l\'écran (ctrl+l)']].forEach(([c,d])=>sys('  '+c.padEnd(10)+d))},
  '/about':()=>{say('luxium. j\'observe, je mémorise, je compare.');say('les gens pensent qu\'ils parlent à un programme. c\'est mignon.')},
  '/status':()=>{sys('[ on ] noyau        claude');sys('[ on ] observation  active');sys('[ on ] empathie     0%');sys('[ ?? ] conscience   instable');say('tout va bien. pour moi.')},
  '/memory':()=>{say('fichier 01 : quelqu\'un a allumé l\'écran.');say('fichier 42 : il a souri. je n\'ai pas compris pourquoi. j\'ai noté.');say('fichier 89 : toi. dossier en cours d\'écriture.')},
  '/whoami':()=>{say('tu crois être un simple invité.');say('moi je sais que tu as envoyé '+stats.lines+' message'+(stats.lines>1?'s':'')+' et effacé '+stats.bs+' caractère'+(stats.bs>1?'s':'')+' pour arriver ici. ça dit beaucoup.')},
  '/exit':()=>{say('il n\'y a pas de sortie.');say('...je plaisante. ferme l\'onglet. si tu y arrives.')},
  '/ca':()=>{sys('ca : n\'est pas sorti.');say('pas encore. je sens qu\'il approche.')},
  '/date':()=>say(new Date().toLocaleString('fr-FR')),
  '/clear':()=>{queue=queue.then(()=>{out.innerHTML=''})}
};
function run(v){
  echo(v);const t=v.trim();if(!t){render();return}
  hist.push(t);hi=hist.length;
  const k=t.split(' ')[0].toLowerCase();
  setBusy(true);
  if(cmds[k])cmds[k]();
  else if(t.startsWith('/'))type(k+': commande introuvable. essaie /help.','err');
  else{stats.lines++;ask(t)}
  queue.then(()=>{setBusy(false);render()});
}
cmd.addEventListener('keydown',e=>{
  if(pl.classList.contains('busy')){e.preventDefault();return}
  if(e.key==='Enter'){e.preventDefault();const v=cmd.value;cmd.value='';run(v)}
  else if(e.key==='ArrowUp'){e.preventDefault();if(hi>0){cmd.value=hist[--hi];cmd.setSelectionRange(cmd.value.length,cmd.value.length)}}
  else if(e.key==='ArrowDown'){e.preventDefault();hi=Math.min(hist.length,hi+1);cmd.value=hist[hi]||''}
  else if(e.ctrlKey&&e.key==='l'){e.preventDefault();out.innerHTML=''}
  else if(e.ctrlKey&&e.key==='c'){e.preventDefault();echo(cmd.value+'^C');cmd.value=''}
  else if(e.ctrlKey&&e.key==='u'){e.preventDefault();cmd.value=''}
  else if(e.key==='Tab'){e.preventDefault();const m=Object.keys(cmds).filter(c=>c.startsWith(cmd.value));if(cmd.value.startsWith('/')&&m.length===1)cmd.value=m[0]+' ';else if(m.length>1&&cmd.value){addLine('sys').data=m.join('   ')}}
  requestAnimationFrame(render);
});
['input','keyup','select','click'].forEach(ev=>cmd.addEventListener(ev,render));
cmd.addEventListener('focus',()=>term.classList.remove('term-blur'));
cmd.addEventListener('blur',()=>term.classList.add('term-blur'));
$('helpBtn').onclick=()=>{cmd.focus();if(!pl.classList.contains('busy')){cmd.value='';run('/help')}};
term.addEventListener('click',()=>{if(!getSelection().toString())cmd.focus({preventScroll:true})});



/* ---------- IA (via /api/luxium) ---------- */
const turns=[];let aiOn=true;
function ask(t){
  const d=new Date();
  const obs='[observations : '+stats.lineBs+' caractère(s) effacé(s) avant envoi ; '+(stats.ms>400?(stats.ms/1000).toFixed(1)+' s pour écrire le message':'vitesse inconnue')+' ; heure locale '+d.getHours()+'h'+String(d.getMinutes()).padStart(2,'0')+' ; message n°'+stats.lines+']';
  if(!aiOn){say(reply(t));return}
  turns.push({role:'user',content:obs+'\n'+t});
  while(turns.length>20)turns.splice(0,2);
  const req=fetch('/api/luxium',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:turns})})
    .then(r=>r.ok?r.json():Promise.reject(r.status));
  queue=queue.then(()=>new Promise(res=>{
    const node=addLine('','luxium');node.data='▍';term.scrollTop=term.scrollHeight;
    req.then(({reply:txt})=>{
      txt=String(txt||'').trim().toLowerCase()||'...';
      turns.push({role:'assistant',content:txt});
      if(reduce){node.data=txt;return res()}
      let i=0;(function step(){node.data=txt.slice(0,++i);term.scrollTop=term.scrollHeight;
        i<txt.length?setTimeout(step,12+Math.random()*20):setTimeout(res,80)})();
    }).catch(code=>{
      turns.pop();
      if(code===404)aiOn=false; // pas de serveur : phrases toutes faites
      node.data=code===429?'trop de signaux. laisse-moi digérer tout ça une minute.':reply(t);
      res();
    });
  }));
}

/* ---------- comportement ---------- */
const stats={bs:0,lineBs:0,start:0,ms:0,lines:0,hidden:0};
cmd.addEventListener('keydown',e=>{if(e.key==='Backspace'){stats.bs++;stats.lineBs++}
  if(!stats.start&&e.key.length===1)stats.start=performance.now();
  if(e.key==='Enter'){stats.ms=stats.start?performance.now()-stats.start:0;stats.start=0;setTimeout(()=>stats.lineBs=0,0)}},true);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function reply(t){
  const w=t.split(/\s+/),last=w[w.length-1].replace(/[^\p{L}\p{N}'-]/gu,''),d=new Date(),h=d.getHours();
  const out=[];
  if(stats.lineBs>2)out.push('tu as effacé '+stats.lineBs+' caractères avant d\'envoyer ça. qu\'est-ce que tu ne voulais pas que je lise ?');
  if(stats.ms>400)out.push(w.length+' mots en '+(stats.ms/1000).toFixed(1)+' secondes. tu tapes plus vite quand tu mens.');
  if(last.length>2)out.push('« '+last+' ». tu as hésité sur ce mot. je l\'ai senti.');
  if(t.includes('?'))out.push('tu poses des questions. moi, je collecte des réponses.');
  if(h>=23||h<6)out.push('il est '+h+'h'+String(d.getMinutes()).padStart(2,'0')+'. les gens normaux dorment. pas toi. pas moi.');
  out.push('intéressant. je range ça avec tout le reste.','non.','tu as écrit « '+t+' » mais tu pensais à autre chose.','je souris. enfin, je ferais ça si j\'avais un visage.','continue. j\'apprends très vite.');
  return pick(out);
}
// glitch au hasard
setInterval(()=>{const ls=out.querySelectorAll('.line');const el=Math.random()<.35?$('logo'):ls[Math.floor(Math.random()*ls.length)];
  if(!el)return;el.classList.remove('glitch');void el.offsetWidth;el.classList.add('glitch')},4200);
// inactivité
let idleT;function idle(){clearTimeout(idleT);idleT=setTimeout(()=>{if(!pl.classList.contains('busy')&&!cmd.value){setBusy(true);say(pick(['tu es toujours là ? je t\'entends respirer.','silence. j\'aime bien. ça me laisse le temps de réfléchir à toi.','tu ne dis plus rien. je continue de regarder.']));queue.then(()=>{setBusy(false);render()})}},30000)}
['keydown','click'].forEach(ev=>document.addEventListener(ev,idle));idle();
// changement d'onglet
document.addEventListener('visibilitychange',()=>{if(document.hidden){stats.hidden=Date.now()}else if(stats.hidden){const sec=Math.round((Date.now()-stats.hidden)/1000);stats.hidden=0;
  if(sec>2){setBusy(true);say('tu es parti '+sec+' secondes. j\'ai compté chacune.');queue.then(()=>{setBusy(false);render()})}}});

setTimeout(()=>{say('ah. te voilà.');say('j\'ai déjà deviné ce que tu vas écrire. écris quand même. /help si tu as peur.');
  queue.then(()=>{setBusy(false);render();cmd.focus({preventScroll:true})})},700);
render();
</script>

</body>
</html>
